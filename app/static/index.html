<!doctype html>
<meta charset="utf-8">
<title>台股即時大單追蹤</title>
<style>
  /* 配色經 dataviz 驗證器驗過（淺／深兩模式全項通過），勿自行更換。
     買＝紅、賣＝綠，與台股看盤習慣一致。文字一律用中性色，顏色只出現在
     資料的記號上。 */
  :root {
    color-scheme: light dark;
    --buy: #e34948;
    --sell: #008300;
    --ink: #1c1c1c;
    --muted-ink: #6b6b6b;
    --grid: #dcdcdc;
    --axis: #b4b4b4;
    --surface: #ffffff;
    --line: #8884;
    --ok: #1f8a3d;
    --warn: #b3690a;
    --bad: #c0392b;
    /* 均線：單一藍色由淺到深（5 日最淺、120 日最深），刻意避開蠟燭的
       紅綠——顏色本身帶有「快慢」的意義。已通過 dataviz 驗證器，勿自行更換。 */
    --ma5: #cde2fb;
    --ma10: #9ec5f4;
    --ma20: #6da7ec;
    --ma60: #3987e5;
    --ma120: #256abf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --buy: #e66767;
      --sell: #008300;
      --ink: #e9e9e9;
      --muted-ink: #9d9d9d;
      --grid: #3a3a3a;
      --axis: #565656;
      --surface: #1b1b1b;
      --ok: #3fbf67;
      --warn: #e0a233;
      --bad: #e0605a;
      --ma5: #b7d3f6;
      --ma10: #86b6ef;
      --ma20: #5598e7;
      --ma60: #2a78d6;
      --ma120: #184f95;
    }
  }
  /* 明確指定主題時要蓋過系統偏好，兩個方向都要能蓋。 */
  :root[data-theme="dark"] {
    --buy: #e66767; --sell: #008300; --ink: #e9e9e9; --muted-ink: #9d9d9d;
    --grid: #3a3a3a; --axis: #565656; --surface: #1b1b1b;
    --ok: #3fbf67; --warn: #e0a233; --bad: #e0605a;
    --ma5: #b7d3f6; --ma10: #86b6ef; --ma20: #5598e7; --ma60: #2a78d6; --ma120: #184f95;
  }
  :root[data-theme="light"] {
    --buy: #e34948; --sell: #008300; --ink: #1c1c1c; --muted-ink: #6b6b6b;
    --grid: #dcdcdc; --axis: #b4b4b4; --surface: #ffffff;
    --ok: #1f8a3d; --warn: #b3690a; --bad: #c0392b;
    --ma5: #cde2fb; --ma10: #9ec5f4; --ma20: #6da7ec; --ma60: #3987e5; --ma120: #256abf;
  }

  body { font: 14px/1.5 -apple-system, "PingFang TC", sans-serif; margin: 1rem;
         background: var(--surface); color: var(--ink); }
  header { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: .5rem; flex-wrap: wrap; }
  .tab { padding: .3rem .5rem .3rem .8rem; border: 1px solid var(--line); border-radius: 4px;
         cursor: pointer; display: inline-flex; align-items: center; gap: .3rem; }
  .tab.active { background: #8883; font-weight: 600; }
  .tab-remove { border: none; background: none; color: inherit; cursor: pointer;
                font: inherit; line-height: 1; padding: 0 .15rem; opacity: .55; }
  .tab-remove:hover { opacity: 1; }
  .add-symbol { display: flex; gap: .3rem; align-items: center; }
  .add-symbol input { width: 5.5rem; font: inherit; }
  #symbolError { color: var(--bad); font-size: .85em; }
  #subUsage { color: var(--muted-ink); font-size: .85em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; margin-top: 1rem; }
  section { border: 1px solid var(--line); border-radius: 6px; padding: .6rem; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: 1rem; margin: 0 0 .5rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .2rem .4rem; text-align: right; border-bottom: 1px solid #8882;
           font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  .buy { color: var(--buy); }     /* 外盤 */
  .sell { color: var(--sell); }   /* 內盤 */
  .auction { background: #8882; } /* 集合競價 */
  .scroll { max-height: 320px; overflow-y: auto; }
  .price { font-size: 1.6rem; font-weight: 700; }
  .muted { color: var(--muted-ink); font-size: .85em; }

  /* -- 行情健康度：使用者判斷資料可不可信的唯一依據，故意做得比其他
     muted 文字醒目一點（實線字色 + 圓點），不要淹沒在版面裡。 */
  #status { display: inline-flex; align-items: center; gap: .4rem;
            font-size: .9em; font-weight: 600; }
  #status .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #status.ok { color: var(--ok); }
  #status.ok .dot { background: var(--ok); }
  #status.stale { color: var(--warn); }
  #status.stale .dot { background: var(--warn); }
  #status.down { color: var(--bad); }
  #status.down .dot { background: var(--bad); }

  /* -- 大單流向圖 -- */
  .legend { display: flex; gap: 1rem; align-items: center; margin-bottom: .3rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem;
                 color: var(--muted-ink); font-size: .85em; }
  .key { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .key.buy { background: var(--buy); }
  .key.sell { background: var(--sell); }
  .key.close { width: 14px; height: 2px; border-radius: 1px; background: var(--ink); }
  .key.line { width: 14px; height: 2px; border-radius: 1px; }
  /* 圖不貼齊 section 邊緣：寬度 95%、置中，左右各留 2.5% 的空隙。
     捲軸與圖必須被同一個 .chart-wrap 包住，它們的百分比才有同一個基準
     ——否則捲軸會以整個 section 為寬度基準，跟圖對不齊。 */
  .chart-wrap { width: 95%; margin: 0 auto; }
  /* K棒圖（股票日K／期貨1分K）比大單流向圖再小一號：95% × 0.95 = 90.25%。
     兩個旋鈕分工：渲染寬度只由這裡的容器寬度決定（改 HCH.w 動不了它，只會改
     內部座標密度）；渲染高度 = 渲染寬度 × HCH.h / HCH.w，所以「圖變扁」要去
     調 HCH.h，見該處註解。 */
  /* max-width 才是真正讓圖不再佔滿螢幕的那一項：百分比是相對值，螢幕越寬圖
     就越大，縮 5% 追不上。窄螢幕上 max-width 不生效，仍由百分比自適應。 */
  .chart-wrap.candle { width: 85.74%; max-width: 1350px; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .zero { stroke: var(--axis); stroke-width: 1; }
  .chart .tick { fill: var(--muted-ink); font-size: 11px; }
  .chart .axis-title { fill: var(--muted-ink); font-size: 11px; }
  /* 直接標示可能正好落在股價折線上（最新一格常常如此），描一圈底色當光暈，
     否則深色的字疊在深色的線上會整個看不見。 */
  .chart .num { fill: var(--ink); font-size: 11px; font-weight: 600;
                stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round;
                paint-order: stroke fill; }
  .chart .closeline { fill: none; stroke: var(--ink); stroke-width: 2;
                      stroke-linejoin: round; stroke-linecap: round; }
  .chart .closedot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .chart .hit { fill: var(--ink); opacity: 0; }
  .chart .hit:hover { opacity: .07; }

  /* -- 歷史K棒 + 均線圖 -- */
  .chart .candle-wick { stroke-width: 1; }
  .chart .ma-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chart .hchit { fill: var(--ink); opacity: 0; cursor: crosshair; }
  .chart .hchit:hover { opacity: .07; }
  .hint { color: var(--muted-ink); font-size: .85em; }

  /* K棒圖的橫向捲軸。用原生 <input type="range"> 而不是把圖塞進 overflow-x
     的容器：圖是等比縮放的 SVG（viewBox 撐滿寬度），沒有「比容器寬」的
     溢出可捲；能左右移動的是**資料視窗**（顯示第幾根到第幾根），那正好
     就是一個一維的值，range 是它最貼切的控制項，也自帶鍵盤操作。
     左右內縮對齊繪圖區，見 chartScrollHTML。 */
  .chart-scroll { display: block; margin-top: .3rem; height: 12px;
                  -webkit-appearance: none; appearance: none;
                  background: transparent; cursor: pointer; }
  .chart-scroll::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px; background: var(--grid); }
  .chart-scroll::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 44px; height: 8px; border: none; border-radius: 4px;
    background: var(--axis); }
  .chart-scroll:hover::-webkit-slider-thumb { background: var(--muted-ink); }
  .chart-scroll::-moz-range-track {
    height: 8px; border-radius: 4px; background: var(--grid); }
  .chart-scroll::-moz-range-thumb {
    width: 44px; height: 8px; border: none; border-radius: 4px;
    background: var(--axis); }
  .chart-scroll:hover::-moz-range-thumb { background: var(--muted-ink); }

  #tip { position: fixed; z-index: 10; pointer-events: none;
         background: var(--surface); color: var(--ink);
         border: 1px solid var(--axis); border-radius: 5px;
         padding: .35rem .5rem; font-size: .85em; line-height: 1.45;
         box-shadow: 0 2px 8px #0003; font-variant-numeric: tabular-nums; }
  #tip b { font-weight: 600; }
</style>

<header>
  <strong>台股即時大單追蹤</strong>
  <div class="tabs" id="tabs"></div>
  <div class="add-symbol">
    <input id="newSymbol" type="text" placeholder="代碼（例如 2454）" maxlength="6">
    <button id="addSymbolBtn">新增</button>
  </div>
  <span id="subUsage"></span>
  <span id="status"><i class="dot"></i>連線中…</span>
  <span id="futStatus" class="muted"></span>
</header>
<div id="symbolError" hidden></div>

<div class="grid" id="panels"></div>
<div id="tip" hidden></div>

<script>
const state = {
  snapshots: {}, symbols: [], active: null, feed: null,
  // -- K棒圖：所有圖共用這四個 map，以 chart key 區分（股票代碼、期貨合約
  // 代碼、FUT_DAILY_KEY）。client 端快取讓切分頁不必每次重打 API，
  // chartView 存各張圖自己的縮放/捲動位置。
  chartData: {}, chartView: {}, chartLoading: {}, chartError: {},
  // -- 台指期：即時報價 ＋ 當日 1 分K，來自 GET /api/futures 的輪詢。
  // 不進 snapshots／symbols——那兩個是股票逐筆聚合的東西，期貨沒有逐筆
  // 資料，形狀完全不同，混在一起只會讓每個讀取點都要先判斷市場別。
  futuresEnabled: false, futuresQuote: null, futuresStatus: null,
  // 拖 K 棒圖捲軸的期間，擋掉行情更新觸發的整塊重畫（見 render()）。
  chartDragging: false,
  // 使用者是否自己點過分頁。false 時期貨會被設成預設分頁（見 pollFutures）。
  tabChosen: false,
};
const fmt = n => (n ?? 0).toLocaleString("zh-TW");
const money = n => (n ?? 0).toLocaleString("zh-TW", { maximumFractionDigits: 0 });
const clock = us => us ? new Date(us / 1000).toLocaleTimeString("zh-TW", { hour12: false }) : "—";
const hhmm = us => new Date(us / 1000).toLocaleTimeString("zh-TW",
  { hour12: false, hour: "2-digit", minute: "2-digit" });
// 名稱來自 API，一律逸出後才進 innerHTML。
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const label = snap => esc(`${snap.symbol} ${snap.name || ""}`.trim());

function sideLabel(side) {
  return { buy: "買", sell: "賣", auction: "競價", unknown: "?" }[side] ?? side;
}

function ladderTable(rows, title) {
  if (!rows.length) return `<h2>${title}</h2><p class="muted">尚無資料</p>`;
  // 未分類欄只在真的有值時才出現 —— 連續交易時段實測為 0 筆，
  // 常態顯示一整欄破折號只會佔版面。
  const hasUnknown = rows.some(r => r.unknown_lots);
  const body = rows.map(r => `<tr class="${r.auction_lots ? "auction" : ""}">
      <td>${r.price}</td>
      <td class="buy">${fmt(r.buy_lots)}</td>
      <td class="sell">${fmt(r.sell_lots)}</td>
      <td>${r.auction_lots ? fmt(r.auction_lots) : "—"}</td>
      ${hasUnknown ? `<td>${r.unknown_lots ? fmt(r.unknown_lots) : "—"}</td>` : ""}
    </tr>`).join("");
  return `<h2>${title}</h2><div class="scroll"><table>
    <tr><th>價格</th><th>買(外盤)</th><th>賣(內盤)</th><th>集合競價</th>${
      hasUnknown ? "<th>未分類</th>" : ""}</tr>
    ${body}</table></div>`;
}

function tradeTable(rows, title, unit) {
  if (!rows.length) return `<h2>${title}</h2><p class="muted">尚無資料</p>`;
  const body = rows.map(t => `<tr>
      <td>${clock(t.time)}</td>
      <td>${t.price}</td>
      <td class="${t.side}">${sideLabel(t.side)}</td>
      <td>${fmt(t.lots)}</td>
      <td>${money(t.value_twd)}</td>
    </tr>`).join("");
  return `<h2>${title}</h2><div class="scroll"><table>
    <tr><th>時間</th><th>價格</th><th>別</th><th>${unit}數</th><th>金額</th></tr>
    ${body}</table></div>`;
}

// -- 大單流向圖 -----------------------------------------------------------
// 原生 SVG，無任何外部套件。柱＝大單張數（買向上、賣向下，零線在中間），
// 折線＝股價（右軸）。雙軸是使用者指定的；因此兩軸都標單位，格線只屬於
// 左軸，避免暗示兩個尺度之間有什麼固定關係。
const CH = { w: 880, h: 285, ml: 64, mr: 64, mt: 18, mb: 30 };
const BUCKET_US = 5 * 60 * 1e6;

function niceCeil(v) {
  if (!(v > 0)) return 1;
  const exp = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / exp;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * exp;
}

const tickText = v => Number(v.toFixed(1)).toLocaleString("zh-TW");

// 柱子：資料端 4px 圓角，零線那端維持方角。
function barPath(x, w, zeroY, len, up) {
  const r = Math.min(4, w / 2, len);
  if (up) {
    const y = zeroY - len;
    return `M${x} ${zeroY}L${x} ${y + r}Q${x} ${y} ${x + r} ${y}`
         + `L${x + w - r} ${y}Q${x + w} ${y} ${x + w} ${y + r}L${x + w} ${zeroY}Z`;
  }
  const y = zeroY + len;
  return `M${x} ${zeroY}L${x} ${y - r}Q${x} ${y} ${x + r} ${y}`
       + `L${x + w - r} ${y}Q${x + w} ${y} ${x + w} ${y - r}L${x + w} ${zeroY}Z`;
}

function flowChart(snap, unit) {
  const buckets = snap.buckets || [];
  const title = `<h2>大單流向 <span class="muted">五分鐘一格・≥ ${fmt(snap.large_order_lots)} ${unit}</span></h2>`;
  if (!buckets.length) return `${title}<p class="muted">尚無大單</p>`;

  const plotW = CH.w - CH.ml - CH.mr;
  const plotH = CH.h - CH.mt - CH.mb;
  const zeroY = CH.mt + plotH / 2;
  const half = plotH / 2;
  const barMax = half - 14;              // 留 14px 給直接標示，柱子不會被切掉
  const slot = plotW / buckets.length;
  const barW = Math.max(1, Math.min(slot - 2, 18));   // 相鄰柱之間留 2px
  const inset = (slot - barW) / 2;

  const peak = Math.max(...buckets.map(b => Math.max(b.buy_lots, b.sell_lots)));
  const top = niceCeil(peak);
  const lotY = lots => (lots / top) * barMax;

  const closes = buckets.map(b => b.close);
  let pMin = Math.min(...closes), pMax = Math.max(...closes);
  if (pMax - pMin < 1e-9) { pMax += 0.5; pMin -= 0.5; }   // 全場同價也要畫得出來
  const priceY = p => CH.mt + 6 + (pMax - p) / (pMax - pMin) * (plotH - 12);

  // 格線只屬於左軸（大單張數）；右軸只給端點刻度，不再畫一組格線。
  const grid = [1, 0.5, 0, -0.5, -1].map(f => {
    const y = zeroY - f * barMax;
    const cls = f === 0 ? "zero" : "gridline";
    return `<line class="${cls}" x1="${CH.ml}" y1="${y}" x2="${CH.ml + plotW}" y2="${y}"/>`
         + `<text class="tick" x="${CH.ml - 8}" y="${y + 4}" text-anchor="end">${tickText(Math.abs(f) * top)}</text>`;
  }).join("");

  // 直接標示只給最大值與最新一格 —— 每根都標數字會蓋掉圖形本身。
  let peakAt = -1, peakSide = "", peakVal = 0;
  // 平手時取較晚的那格：同樣大的一筆，剛剛發生的比早上那筆有意思
  buckets.forEach((b, i) => {
    if (b.buy_lots >= peakVal && b.buy_lots > 0) { peakVal = b.buy_lots; peakAt = i; peakSide = "buy"; }
    if (b.sell_lots >= peakVal && b.sell_lots > 0) { peakVal = b.sell_lots; peakAt = i; peakSide = "sell"; }
  });
  const last = buckets.length - 1;
  const marked = new Set();
  if (peakVal > 0) marked.add(`${peakAt}:${peakSide}`);
  if (buckets[last].buy_lots) marked.add(`${last}:buy`);
  if (buckets[last].sell_lots) marked.add(`${last}:sell`);

  let bars = "", notes = "";
  buckets.forEach((b, i) => {
    const x = CH.ml + i * slot + inset;
    const mid = CH.ml + i * slot + slot / 2;
    [["buy", b.buy_lots, true], ["sell", b.sell_lots, false]].forEach(([side, lots, up]) => {
      if (!lots) return;
      const len = Math.max(2, lotY(lots));
      // 買賣柱在零線兩側相接，各退 1px，湊出 2px 的底色間隙
      const base = up ? zeroY - 1 : zeroY + 1;
      bars += `<path d="${barPath(x, barW, base, len, up)}" fill="var(--${side})"/>`;
      if (!marked.has(`${i}:${side}`)) return;
      const y = up ? base - len - 5 : base + len + 12;
      notes += `<text class="num" x="${mid}" y="${y}" text-anchor="middle">${fmt(lots)}</text>`;
    });
  });

  const points = buckets.map((b, i) =>
    `${CH.ml + i * slot + slot / 2},${priceY(b.close)}`).join(" ");
  const lastX = CH.ml + last * slot + slot / 2;
  const line = `<polyline class="closeline" points="${points}"/>`
             + `<circle class="closedot" cx="${lastX}" cy="${priceY(closes[last])}" r="4"/>`;

  // x 軸：格子多的時候抽樣。由右往左挑，最新一格一定留著，擠不下的往左捨棄，
  // 標籤才不會互相疊字。
  const step = Math.max(1, Math.ceil(buckets.length / 7));
  const wanted = [];
  for (let i = 0; i < buckets.length; i += step) wanted.push(i);
  if (wanted[wanted.length - 1] !== last) wanted.push(last);
  const kept = [];
  for (let k = wanted.length - 1; k >= 0; k--) {
    const x = CH.ml + wanted[k] * slot + slot / 2;
    if (!kept.length || kept[kept.length - 1].x - x >= 46) kept.push({ i: wanted[k], x });
  }
  const times = kept.map(({ i, x }) =>
    `<text class="tick" x="${x}" y="${CH.mt + plotH + 18}" text-anchor="middle">${
      hhmm(buckets[i].t)}</text>`).join("");

  const rightTicks = [pMax, pMin].map(p =>
    `<text class="tick" x="${CH.ml + plotW + 8}" y="${priceY(p) + 4}">${tickText(p)}</text>`).join("");

  const hits = buckets.map((_, i) =>
    `<rect class="hit" data-i="${i}" x="${CH.ml + i * slot}" y="${CH.mt}" `
    + `width="${slot}" height="${plotH}"/>`).join("");

  return `${title}
    <div class="legend">
      <span><i class="key buy"></i>買（向上）</span>
      <span><i class="key sell"></i>賣（向下）</span>
      <span><i class="key close"></i>股價</span>
    </div>
    <div class="chart-wrap">
    <svg class="chart" viewBox="0 0 ${CH.w} ${CH.h}" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="每五分鐘大單買賣張數與股價">
      ${grid}${bars}${line}${notes}${times}${rightTicks}
      <text class="axis-title" x="14" y="${CH.mt + plotH / 2}" text-anchor="middle"
            transform="rotate(-90 14 ${CH.mt + plotH / 2})">大單${unit}數（${unit}）</text>
      <text class="axis-title" x="${CH.w - 12}" y="${CH.mt + plotH / 2}" text-anchor="middle"
            transform="rotate(90 ${CH.w - 12} ${CH.mt + plotH / 2})">股價（元）</text>
      ${hits}
    </svg>
    </div>`;
}

// -- 歷史K棒 + 均線圖（Task 17）-------------------------------------------
// 通用元件：只依賴 /api/history/{symbol} 回傳的 {symbol,name,candles,ma}，
// 不知道也不需要知道背後是股票還是（日後的）期貨合約。原生 SVG，無套件。
// h 是「圖多扁」的旋鈕：SVG 以容器寬度等比縮放，渲染高度 = 渲染寬度 × h/w。
// 304 → 280 讓繪圖區從 254 矮成 230（plotH = h - mt - mb），字級與線寬不受影響
// ——那些跟著寬度走的縮放比例沒有變。
const HCH = { w: 880, h: 280, ml: 60, mr: 16, mt: 16, mb: 34 };
const MIN_VISIBLE_BARS = 20;

// 均線週期由資料本身決定，不寫死一份清單：股票日K是 5/10/20/60/120，
// 期貨1分K是 5/10/20/60（一般交易時段只有 300 分鐘，120 期均線要到收盤前
// 才畫得出一小段，佔著圖例卻幾乎沒有資訊）。寫死的話期貨那張圖會對著不
// 存在的 ma["120"] 讀出 undefined，圖例也會多一條永遠畫不出來的線。
const chartPeriods = data => Object.keys(data.ma || {}).map(Number).sort((a, b) => a - b);
// x 軸標籤：日K的 date 是 "2026-08-13"（只取月日），分K是 "11:16"（原樣顯示）。
const barLabel = d => (String(d).includes(":") ? d : String(d).slice(5));
// 圖例與提示框裡的週期單位：期貨的 payload 會帶 bar_unit="分"，股票沒帶就是日。
const barUnit = data => data.bar_unit || "日";

// 期貨分頁的識別字。用固定的哨符而不是合約代碼：合約代碼（TXFH6-F）要等
// 第一次輪詢成功才知道，而分頁在那之前就要畫得出來（不然「正在取得行情」
// 這句話沒有地方顯示）；每月換月時代碼也會變，分頁不該跟著換身分。
const FUTURES_TAB = "__futures__";
// 期貨歷史日K的 chart key。它與 1 分K 同屬一個合約，不能共用 key，否則
// 兩張圖會共用同一份縮放狀態、同一組 DOM id，拖其中一張會動到另一張。
const FUT_DAILY_KEY = "__futures_daily__";

const CHART_TITLES = {
  stock: "歷史日K + 均線",
  fut1m: "當日 1 分K + 均線",
  futDaily: "歷史日K + 均線（連續近月）",
};

// 一頁可以同時有多張 K 棒圖（期貨分頁就有 1 分K 與 日K 兩張），所以每張圖的
// DOM id 都由它的 chart key 推導，不能再共用一組固定的 "history*" id——
// 兩張圖搶同一個 id 時，後面那張的捲軸會去操作前面那張的圖。
function chartIds(key) {
  const slug = String(key).replace(/[^\w-]/g, "_");
  return { box: `chartbox-${slug}`, svg: `chartsvg-${slug}`,
           scroll: `chartscroll-${slug}`, hint: `charthint-${slug}` };
}

// 所有圖的資料都放同一個 map，取用端不必知道它是誰抓來的：
// 股票日K 來自 /api/history、期貨1分K 來自 /api/futures 的輪詢、
// 期貨日K 來自 /api/futures/daily。
const chartDataFor = key => state.chartData[key];

// 目前分頁上「主要那張圖」的 key（股票是代碼，期貨是合約代碼）。
function activeChartSymbol() {
  return state.active === FUTURES_TAB
    ? (state.futuresQuote && state.futuresQuote.symbol) : state.active;
}

// 預設看最近 90 根；資料不足 90 根就整段顯示。
function defaultHistoryView(total) {
  const count = Math.min(90, total);
  return { start: total - count, count };
}

// 縮放與資料長度變動後夾回合法範圍：count 在 [20, total]，start 在
// [0, total-count]。資料剛載入、或（理論上）縮放到邊界時都要夾一次。
function clampHistoryView(view, total) {
  const minCount = Math.min(MIN_VISIBLE_BARS, total);
  const count = Math.max(minCount, Math.min(total, Math.round(view.count)));
  const start = Math.max(0, Math.min(total - count, Math.round(view.start)));
  return { start, count };
}

function priceTicks(min, max, count = 5) {
  if (max - min < 1e-9) { max += 0.5; min -= 0.5; }
  return Array.from({ length: count }, (_, i) => min + (max - min) * i / (count - 1));
}

// 只畫 <svg> 本身（不含標題、圖例、捲軸）：拖捲軸與滾輪縮放都只重畫這一段。
function candleChartSvg(key, chartTitle) {
  const data = chartDataFor(key);
  const { candles, ma } = data;
  const periods = chartPeriods(data);
  const total = candles.length;
  const view = clampHistoryView(
    state.chartView[key] || defaultHistoryView(total), total);
  state.chartView[key] = view;
  const { start, count } = view;
  const visible = candles.slice(start, start + count);

  const plotW = HCH.w - HCH.ml - HCH.mr;
  const plotH = HCH.h - HCH.mt - HCH.mb;
  const slot = plotW / count;
  // 實體寬度隨可見根數自適應；空間不足 1px 時不畫實體，只留影線
  // （本來就會畫），視覺上自然收斂成一張線圖，不會畫出重疊的方塊。
  const bodyW = Math.max(0, slot - 2);
  const drawBody = bodyW >= 1;

  // y 軸範圍依目前可見區間的蠟燭高低點自動調整，不是固定全期。刻意不把
  // 均線的值也算進來撐開範圍——長週期均線（例如 60 期）縮到很短的窗口
  // 時常常會偏離當下價格很多，若把它也算進 y 軸，蠟燭會被擠成一小條，
  // 反而更難看懂。均線超出範圍的部分改用 clipPath 在圖表邊界切齊
  // （見下方 <clipPath>），效果等同「線跑出圖外」，跟大部分看盤軟體一致。
  let lo = Math.min(...visible.map(c => c.low));
  let hi = Math.max(...visible.map(c => c.high));
  const pad = (hi - lo) * 0.06 || Math.max(1, hi * 0.02);
  lo -= pad; hi += pad;
  const priceY = p => HCH.mt + (hi - p) / (hi - lo) * plotH;

  const ids = chartIds(key);
  const clipId = `clip-${ids.svg}`;      // clipPath 的 id 也要逐張唯一

  const grid = priceTicks(lo, hi).map(v => {
    const y = priceY(v);
    return `<line class="gridline" x1="${HCH.ml}" y1="${y}" x2="${HCH.ml + plotW}" y2="${y}"/>`
         + `<text class="tick" x="${HCH.ml - 8}" y="${y + 4}" text-anchor="end">${tickText(v)}</text>`;
  }).join("");

  let wicks = "", bodies = "";
  visible.forEach((c, i) => {
    const x = HCH.ml + i * slot + slot / 2;
    const up = c.close >= c.open;
    const color = `var(--${up ? "buy" : "sell"})`;
    const yHigh = priceY(c.high), yLow = priceY(c.low);
    wicks += `<line class="candle-wick" x1="${x}" y1="${yHigh}" x2="${x}" y2="${yLow}" stroke="${color}"/>`;
    if (drawBody) {
      const yOpen = priceY(c.open), yClose = priceY(c.close);
      const yTop = Math.min(yOpen, yClose);
      const h = Math.max(1, Math.abs(yClose - yOpen));    // 平盤（開＝收）也要畫得出來
      bodies += `<rect class="candle-body" x="${x - bodyW / 2}" y="${yTop}" `
              + `width="${bodyW}" height="${h}" fill="${color}"/>`;
    }
  });

  // 均線：null 的區段要斷開，不可跨過空值直連——每遇到 null 就重新
  // "M" 起筆，而不是接著 "L" 畫過去。
  let maPaths = "";
  periods.forEach(period => {
    const arr = ma[String(period)];
    let d = "", drawing = false;
    for (let i = 0; i < count; i++) {
      const v = arr[start + i];
      if (v == null) { drawing = false; continue; }
      const x = HCH.ml + i * slot + slot / 2;
      const y = priceY(v);
      d += (drawing ? "L" : "M") + `${x} ${y}`;
      drawing = true;
    }
    if (d) maPaths += `<path class="ma-line" d="${d}" stroke="var(--ma${period})"/>`;
  });

  // x 軸：依縮放程度疏化，標籤像素間距太近就往左捨棄（最新一根一定留著）。
  const step = Math.max(1, Math.ceil(count / 8));
  const wanted = [];
  for (let i = 0; i < count; i += step) wanted.push(i);
  if (wanted[wanted.length - 1] !== count - 1) wanted.push(count - 1);
  const kept = [];
  for (let k = wanted.length - 1; k >= 0; k--) {
    const x = HCH.ml + wanted[k] * slot + slot / 2;
    if (!kept.length || kept[kept.length - 1].x - x >= 56) kept.push({ i: wanted[k], x });
  }
  const dateLabels = kept.map(({ i, x }) =>
    `<text class="tick" x="${x}" y="${HCH.mt + plotH + 18}" text-anchor="middle">${
      barLabel(visible[i].date)}</text>`).join("");

  // hit 區塊帶上 data-key：提示框靠它分辨游標在哪一張圖上。
  const hits = visible.map((_, i) =>
    `<rect class="hchit" data-i="${i}" data-key="${esc(key)}" `
    + `x="${HCH.ml + i * slot}" y="${HCH.mt}" width="${slot}" height="${plotH}"/>`).join("");

  return `<svg class="chart" id="${ids.svg}" viewBox="0 0 ${HCH.w} ${HCH.h}"
         preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="${esc(chartTitle)}">
      <defs>
        <clipPath id="${clipId}"><rect x="${HCH.ml}" y="${HCH.mt}" width="${plotW}" height="${plotH}"/></clipPath>
      </defs>
      ${grid}
      <g clip-path="url(#${clipId})">${wicks}${bodies}${maPaths}</g>
      ${dateLabels}
      <text class="axis-title" x="14" y="${HCH.mt + plotH / 2}" text-anchor="middle"
            transform="rotate(-90 14 ${HCH.mt + plotH / 2})">價格（元）</text>
      ${hits}
    </svg>`;
}

// 整塊圖：標題 + 圖例 + 圖 + 橫向捲軸。圖本身另外包一層 .chart-wrap > #box，
// 拖捲軸時只換 #box 的內容，捲軸自己的 DOM 節點不動——瀏覽器在拖曳中途
// 若把 <input> 換掉，那次拖曳會直接中斷，手感變成「拖一格就斷」。
function candleChart(key, chartTitle) {
  const data = chartDataFor(key);
  const total = data.candles.length;
  // 先把視窗夾好寫回 state 再組字串：chartHint 在樣板裡排在 candleChartSvg
  // 之前求值，若等 candleChartSvg 才寫入，第一次渲染的標題會顯示
  // 「顯示 undefined / N 根」。
  const { start, count } = state.chartView[key] = clampHistoryView(
    state.chartView[key] || defaultHistoryView(total), total);
  const ids = chartIds(key);
  return `<h2>${chartTitle} <span class="hint" id="${ids.hint}">${chartHint(key)}</span></h2>
    ${chartLegend(data)}
    <div class="chart-wrap candle">
      <div id="${ids.box}">${candleChartSvg(key, chartTitle)}</div>
      ${chartScrollHTML(key, total, start, count)}
    </div>`;
}

// 一整塊圖（含「載入中」「載入失敗」的狀態），給任何分頁重複使用。
function chartSection(key, chartTitle) {
  if (state.chartError[key]) {
    return `<h2>${chartTitle}</h2>
      <p class="muted" style="color: var(--bad)">${esc(state.chartError[key])}</p>`;
  }
  const data = chartDataFor(key);
  if (!data) return `<h2>${chartTitle}</h2><p class="muted">載入中…</p>`;
  if (!data.candles.length) return `<h2>${chartTitle}</h2><p class="muted">尚無資料</p>`;
  return candleChart(key, chartTitle);
}

function chartHint(key) {
  const data = chartDataFor(key);
  const view = state.chartView[key] || {};
  return `${esc(data.name || data.symbol)}・顯示 ${view.count} / ${data.candles.length} 根`
       + `・滾輪縮放、下方捲軸左右移動`;
}

function chartLegend(data) {
  const unit = barUnit(data);
  return `<div class="legend">
      <span><i class="key buy"></i>漲</span>
      <span><i class="key sell"></i>跌</span>
      ${chartPeriods(data).map(p =>
        `<span><i class="key line" style="background:var(--ma${p})"></i>${p}${unit}均線</span>`
      ).join("")}
    </div>`;
}

// 捲軸只在「看不完」時才出現：count === total 時沒有東西可捲，留一條永遠
// 拖不動的軌道只會讓人以為壞了。左右內縮對齊繪圖區（ml/mr 佔 viewBox 的
// 比例），滑桿的位置才對得上圖上實際的位置。
function chartScrollHTML(key, total, start, count) {
  if (count >= total) return "";
  const left = HCH.ml / HCH.w * 100;
  const width = (HCH.w - HCH.ml - HCH.mr) / HCH.w * 100;
  return `<input type="range" class="chart-scroll" id="${chartIds(key).scroll}"
    min="0" max="${total - count}" step="1" value="${start}"
    style="margin-left:${left}%; width:${width}%"
    aria-label="左右移動K棒圖的顯示區間">`;
}

// 滾輪縮放：以游標位置為錨點——縮放前後，游標底下那根K棒要留在原地，
// 不能整張圖只錨在右端（那樣放大時使用者看到的內容會整個跳掉）。
function onHistoryWheel(event, key, chartTitle) {
  event.preventDefault();                 // 不擋住就會整頁跟著捲動
  const data = chartDataFor(key);
  if (!data) return;
  const total = data.candles.length;
  const view = clampHistoryView(
    state.chartView[key] || defaultHistoryView(total), total);

  // 量的是 <svg> 而不是外層容器：外層可能有 padding／寬度不同，用錯基準
  // 會讓錨點偏掉，放大時游標底下那根就不會留在原地。
  const svg = document.getElementById(chartIds(key).svg) || event.currentTarget;
  const rect = svg.getBoundingClientRect();
  const scaleX = HCH.w / rect.width;                 // viewBox 座標 ≠ CSS 像素
  const px = (event.clientX - rect.left) * scaleX;
  const plotW = HCH.w - HCH.ml - HCH.mr;
  const frac = Math.min(1, Math.max(0, (px - HCH.ml) / plotW));
  const anchorIdx = view.start + frac * view.count;   // 游標底下那根的資料索引

  const factor = event.deltaY < 0 ? 0.85 : 1 / 0.85;  // 向上（deltaY<0）放大＝根數變少
  const nextCount = view.count * factor;
  const nextStart = anchorIdx - frac * nextCount;      // 保持錨點在同一個像素位置

  state.chartView[key] = clampHistoryView(
    { start: nextStart, count: nextCount }, total);
  redrawChart(key, chartTitle);
}

// 只重畫 <svg>，並把捲軸的 max/value 同步過去（縮放會改變可捲範圍：放大
// 到剩 20 根時能捲的距離最大，縮到全部時捲軸該消失）。捲軸節點本身不重建，
// 拖曳中途才不會斷掉。
function redrawChart(key, chartTitle) {
  const data = chartDataFor(key);
  const ids = chartIds(key);
  const box = document.getElementById(ids.box);
  if (!data || !box) return;
  box.innerHTML = candleChartSvg(key, chartTitle);

  const { start, count } = state.chartView[key];
  const total = data.candles.length;
  const scroll = document.getElementById(ids.scroll);
  if (scroll) {
    if (count >= total) {
      scroll.remove();                       // 縮到看得完整份，就不需要捲軸了
    } else {
      scroll.max = String(total - count);
      scroll.value = String(start);
    }
  } else if (count < total) {
    // 從「看得完」縮放回「看不完」：把捲軸補回來（緊接在圖後面）。
    box.insertAdjacentHTML("afterend", chartScrollHTML(key, total, start, count));
    bindChartScroll(key, chartTitle);
  }

  const hint = document.getElementById(ids.hint);
  if (hint) hint.innerHTML = chartHint(key);
}

function onHistoryScroll(event, key, chartTitle) {
  const data = chartDataFor(key);
  if (!data) return;
  const view = state.chartView[key];
  state.chartView[key] = clampHistoryView(
    { start: Number(event.currentTarget.value), count: view.count },
    data.candles.length);
  redrawChart(key, chartTitle);
}

function historyTipHTML(key, localIndex) {
  const data = chartDataFor(key);
  const view = state.chartView[key];
  if (!data || !view) return null;
  const c = data.candles[view.start + localIndex];
  if (!c) return null;
  const unit = barUnit(data);
  const maLine = chartPeriods(data).map(p => {
    const v = data.ma[String(p)][view.start + localIndex];
    return `${p}${unit} ${v != null ? v.toFixed(2) : "—"}`;
  }).join("　");
  return `<b>${c.date}</b><br>開 ${c.open}　高 ${c.high}　低 ${c.low}　收 ${c.close}<br>
    量 ${fmt(c.volume)}<br><span class="muted">${maLine}</span>`;
}

// 滾輪縮放與捲軸都綁在這裡。滾輪刻意綁在外層的 #box 而不是 <svg> 本身：
// 每次重畫都會換掉裡面那個 <svg>，綁在它身上的 handler 會跟著消失，綁在
// 不會被替換的外層則靠事件冒泡照樣收得到。
function bindChartControls(key, chartTitle) {
  const box = document.getElementById(chartIds(key).box);
  if (box) box.addEventListener("wheel",
    event => onHistoryWheel(event, key, chartTitle), { passive: false });
  bindChartScroll(key, chartTitle);
}

function bindChartScroll(key, chartTitle) {
  const scroll = document.getElementById(chartIds(key).scroll);
  if (!scroll) return;
  scroll.addEventListener("input", event => onHistoryScroll(event, key, chartTitle));
  // 拖曳期間把整塊重畫擋下來（見 render() 開頭），否則手上的滑桿節點會被
  // 換掉、拖曳當場中斷。
  scroll.addEventListener("pointerdown", () => { state.chartDragging = true; });
}

// 放開滑鼠就解除封鎖，並補畫一次把拖曳期間擋掉的更新一次補上。
//
// 監聽掛在 document 而不是滑桿本身，是因為滑桿節點會被重畫換掉：若 pointerup
// 的監聽跟著那個節點一起消失，旗標就永遠停在 true，整個畫面從此不再更新
// ——那比原本的 bug 嚴重得多。掛在 document 上的這一份只註冊一次、永遠存在，
// 不論指標最後在哪裡放開（拖出視窗、拖到別的元素上）都收得到。
function finishChartDrag() {
  if (!state.chartDragging) return;
  state.chartDragging = false;
  render();
}
document.addEventListener("pointerup", finishChartDrag);
document.addEventListener("pointercancel", finishChartDrag);
// 指標在視窗外放開時 pointerup 不會送達，改由這個補；也涵蓋切到別的分頁。
window.addEventListener("blur", finishChartDrag);

// 通用的「載入一張圖的資料」：股票日K 打 /api/history，期貨日K 打
// /api/futures/daily。兩者的回應形狀相同（{symbol,name,candles,ma}），
// 差別只有位址與 key，所以共用同一支。
async function ensureChart(key, url, chartTitle) {
  if (state.chartData[key] || state.chartLoading[key]) return;
  state.chartLoading[key] = true;
  state.chartError[key] = null;
  try {
    const response = await fetch(url);
    const body = await response.json().catch(() => ({}));
    if (!response.ok) {
      state.chartError[key] = body.detail || `載入失敗（HTTP ${response.status}）`;
      return;
    }
    state.chartData[key] = body;
    state.chartView[key] = defaultHistoryView(body.candles.length);
  } catch {
    state.chartError[key] = "載入失敗：無法連線到伺服器";
  } finally {
    state.chartLoading[key] = false;
    refreshChartBox(key, chartTitle);
  }
}

const ensureHistory = symbol =>
  ensureChart(symbol, `/api/history/${encodeURIComponent(symbol)}`, CHART_TITLES.stock);
const ensureFuturesDaily = () =>
  ensureChart(FUT_DAILY_KEY, "/api/futures/daily", CHART_TITLES.futDaily);

// 只重繪某一張圖的容器，不動整個面板——載入完成時不該把價位階梯的捲動
// 位置或門檻輸入框的游標一起弄丟。
function refreshChartBox(key, chartTitle) {
  const section = document.getElementById(`section-${chartIds(key).box}`);
  if (!section) return;                     // 分頁已經切走，這次更新過期了
  section.innerHTML = chartSection(key, chartTitle);
  bindChartControls(key, chartTitle);
}

// 一整個 <section>：外面包一層固定 id，載入完成後才找得到要換的容器。
function chartSectionHTML(key, chartTitle) {
  return `<section class="wide" id="section-${chartIds(key).box}">${
    chartSection(key, chartTitle)}</section>`;
}

// 重繪前後保留使用者的位置與輸入。整塊替換 innerHTML 每秒最多發生 5 次
// （更新合併間隔 0.2 秒），不保留的話全日價位階梯與 200 列明細
// 在盤中根本捲不動，門檻也打不完一個數字。
function scrollOffsets(panels) {
  return [...panels.querySelectorAll("section")].map(section => {
    const box = section.querySelector(".scroll");
    return box ? box.scrollTop : 0;
  });
}

function restoreScroll(panels, offsets) {
  panels.querySelectorAll("section").forEach((section, i) => {
    const box = section.querySelector(".scroll");
    if (box && offsets[i]) box.scrollTop = offsets[i];
  });
}

// -- 台指期分頁 ------------------------------------------------------------
// 期貨這一頁只有兩件事：即時價格與 1 分 K，沒有逐筆成交、沒有大單、沒有
// 每價位成交量——資料來源是期交所 MIS 的即時行情（見 app/futures.py），
// 那邊本來就不提供逐筆委託／成交的單量明細。因此它不共用股票的 render()，
// 而是自己一小段版面；資料也不走 /ws 推播，改用 GET /api/futures 輪詢
// （來源本身就是每 5 秒一次的 REST，沒有「有新成交就推」這回事）。
function futuresNotice() {
  const f = state.futuresStatus;
  if (!f || f.state === "connected") return "";
  const reason = {
    disabled: "期貨追蹤未啟用（啟動時可用 --futures 開啟）",
    unavailable: `期貨行情不可用：${f.unavailable_reason || "原因不明"}`,
    reconnecting: `正在向期交所取得行情…${f.last_error ? `（${f.last_error}）` : ""}`,
    stale: "期貨行情停滯：已超過 90 秒沒有成功更新，畫面上的數字不可信",
    stopped: "期貨輪詢已停止",
  }[f.state] || `期貨行情狀態：${f.state}`;
  return `<p class="muted" style="color: var(--bad)">⚠ ${esc(reason)}</p>`;
}

// 漲跌一律以「參考價」(CRefPrice，即前一交易日結算價) 為基準，與期交所
// 網站同一個定義；用開盤價當基準會在跳空的日子整個對不上。
const signed = (v, digits = 0) =>
  v == null ? "—" : `${v > 0 ? "+" : ""}${v.toLocaleString("zh-TW", {
    minimumFractionDigits: digits, maximumFractionDigits: digits })}`;

function renderFutures() {
  const panels = document.getElementById("panels");
  const quote = state.futuresQuote;
  const sessions = (quote && quote.sessions || [])
    .map(s => `${s.Start.slice(0, 2)}:${s.Start.slice(2)}–${s.End.slice(0, 2)}:${s.End.slice(2)}`)
    .join("、");

  if (!quote) {
    panels.innerHTML = `<section class="wide"><h2>台指期</h2>${futuresNotice()
      || `<p class="muted">載入中…</p>`}</section>`;
    return;
  }

  const up = quote.change != null && quote.change > 0;
  const flat = quote.change == null || quote.change === 0;
  const moveClass = flat ? "" : (up ? "buy" : "sell");

  panels.innerHTML = `
    <section>
      <h2>${esc(`${quote.symbol} ${quote.name || ""}`.trim())}</h2>
      ${futuresNotice()}
      <div class="price ${moveClass}">${quote.last_price != null ? fmt(quote.last_price) : "—"}</div>
      <div class="${moveClass}">${signed(quote.change)}　${
        quote.change_pct != null ? `${signed(quote.change_pct, 2)}%` : ""}</div>
      <div class="muted">最後一根 K 棒 ${esc(quote.bar_time || "—")}｜${esc(quote.date || "")}${
        sessions ? `｜交易時段 ${esc(sessions)}` : ""}</div>
      <table style="margin-top:.5rem">
        <tr><th>開盤</th><td>${fmt(quote.open)}</td></tr>
        <tr><th>最高</th><td class="buy">${fmt(quote.high)}</td></tr>
        <tr><th>最低</th><td class="sell">${fmt(quote.low)}</td></tr>
        <tr><th>參考價</th><td>${fmt(quote.ref_price)}</td></tr>
        <tr><th>買價 / 賣價</th><td>${quote.bid != null ? fmt(quote.bid) : "—"} / ${
          quote.ask != null ? fmt(quote.ask) : "—"}</td></tr>
        <tr><th>漲停 / 跌停</th><td>${fmt(quote.limit_up)} / ${fmt(quote.limit_down)}</td></tr>
        <tr><th>總量</th><td>${fmt(quote.volume)} 口</td></tr>
      </table>
      <div class="muted" style="margin-top:.4rem">資料來源：期交所 MIS 即時行情（每 ${
        state.futuresStatus && state.futuresStatus.interval || 5} 秒更新）</div>
    </section>
    ${chartSectionHTML(quote.symbol, CHART_TITLES.fut1m)}
    ${chartSectionHTML(FUT_DAILY_KEY, CHART_TITLES.futDaily)}`;

  // 1 分K 的資料由 /api/futures 的輪詢供給（已寫進 state.chartData），
  // 只要綁互動就好；歷史日K 走自己的端點，第一次進來才拉一次。
  bindChartControls(quote.symbol, CHART_TITLES.fut1m);
  bindChartControls(FUT_DAILY_KEY, CHART_TITLES.futDaily);
  ensureFuturesDaily();                     // 已快取或載入中時是 no-op
}

function render() {
  // 正在拖 K 棒圖的捲軸就不重畫。render() 會整塊換掉 #panels 的 innerHTML，
  // 連帶把使用者手上那個 <input type="range"> 節點抽掉——瀏覽器的拖曳一旦
  // 失去目標節點就直接結束，症狀正是「拖到一半就停住」。股票分頁每筆成交
  // 都會經 ws 觸發 render（最快 5 次/秒），所以盤中幾乎拖不動。
  // 擋掉的那幾次更新不會遺失：放開時 finishChartDrag() 會補畫一次。
  if (state.chartDragging) return;
  if (state.active === FUTURES_TAB) { renderFutures(); return; }
  const snap = state.snapshots[state.active];
  if (!snap) return;
  const unit = "張";
  const panels = document.getElementById("panels");
  const offsets = scrollOffsets(panels);
  const input = document.getElementById("threshold");
  const typing = input && document.activeElement === input ? input.value : null;

  panels.innerHTML = `
    <section>
      <h2>${label(snap)}</h2>
      ${snap.subscribed === false ? `<p class="muted" style="color: var(--warn)">
        ⚠ 訂閱尚未獲得伺服器確認，這個分頁暫時不會有任何資料。</p>` : ""}
      <div class="price">${snap.last_price ?? "—"}</div>
      <div class="muted">最新成交 ${clock(snap.last_trade_time)}｜共 ${fmt(snap.trade_count)} 筆</div>
      <table style="margin-top:.5rem">
        <tr><th>買(外盤)</th><td class="buy">${fmt(snap.totals.buy_lots)} ${unit}</td></tr>
        <tr><th>賣(內盤)</th><td class="sell">${fmt(snap.totals.sell_lots)} ${unit}</td></tr>
        <tr><th>集合競價</th><td>${fmt(snap.totals.auction_lots)} ${unit}</td></tr>
        ${snap.totals.unknown_lots ? `<tr><th>未分類</th><td>${fmt(snap.totals.unknown_lots)} ${unit}</td></tr>` : ""}
      </table>
      <div style="margin-top:.5rem">
        <label>大單門檻
          <input id="threshold" type="number" min="1" step="1"
                 style="width: 6rem" value="${snap.large_order_lots}">
          ${unit}
        </label>
        <button id="apply">套用</button>
        <div class="muted">只影響 ${label(snap)}；各檔可分別設定</div>
      </div>
    </section>
    <section class="wide">${flowChart(snap, unit)}</section>
    ${chartSectionHTML(state.active, CHART_TITLES.stock)}
    <section>${ladderTable(snap.ladder, "當日每價位成交量")}</section>
    <section>${ladderTable(snap.large_ladder, `大單每價位成交量（≥ ${fmt(snap.large_order_lots)} ${unit}）`)}</section>
    <section>${tradeTable(snap.recent_trades, "近期成交明細", unit)}</section>`;

  restoreScroll(panels, offsets);
  const fresh = document.getElementById("threshold");
  if (typing !== null) {          // 使用者正在打字，別把輸入吃掉
    fresh.value = typing;
    fresh.focus();
  }
  fresh.onkeydown = event => { if (event.key === "Enter") applyThreshold(); };
  document.getElementById("apply").onclick = applyThreshold;
  bindChartControls(state.active, CHART_TITLES.stock);
  ensureHistory(state.active);              // 已快取或載入中時是 no-op
}

async function applyThreshold() {
  const input = document.getElementById("threshold");
  const lots = Math.floor(Number(input.value));   // 門檻的單位是張，沒有半張
  if (!(lots > 0)) return;
  input.blur();                   // 送出後讓伺服器回來的值接手
  await fetch("/api/threshold", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ large_order_lots: lots, symbol: state.active }),
  });
}

// 提示框放在 #panels 之外，重繪不會把它連同事件一起換掉。兩張圖（大單流向、
// 歷史K棒）共用同一個提示框，用 hit 元素的 class 分辨要顯示哪一種內容。
const tip = document.getElementById("tip");
document.addEventListener("mousemove", event => {
  const flowHit = event.target.closest ? event.target.closest(".hit") : null;
  const histHit = event.target.closest ? event.target.closest(".hchit") : null;
  let html = null;
  if (flowHit) {
    const snap = state.snapshots[state.active];
    const bucket = snap && (snap.buckets || [])[Number(flowHit.dataset.i)];
    if (bucket) html = `<b>${hhmm(bucket.t)}–${hhmm(bucket.t + BUCKET_US)}</b><br>
      買 ${fmt(bucket.buy_lots)} 張<br>賣 ${fmt(bucket.sell_lots)} 張<br>
      收盤 ${bucket.close}`;
  } else if (histHit) {
    // 一頁可能有多張圖，所以看 hit 自己帶的 key，不能再假設是當前分頁那張。
    html = historyTipHTML(histHit.dataset.key, Number(histHit.dataset.i));
  }
  if (!html) { tip.hidden = true; return; }
  tip.innerHTML = html;
  tip.hidden = false;
  const pad = 14;
  const x = Math.min(event.clientX + pad, window.innerWidth - tip.offsetWidth - 4);
  const y = Math.min(event.clientY + pad, window.innerHeight - tip.offsetHeight - 4);
  tip.style.left = `${Math.max(4, x)}px`;
  tip.style.top = `${Math.max(4, y)}px`;
});

function renderTabs() {
  const tabs = [];

  // 期貨排在最前面且是預設分頁（見 pollFutures）。它固定由 --futures 決定、
  // 無法從畫面上新增或移除，所以不給移除鈕——點了也只會打中股票專屬的
  // DELETE /api/symbols 而 404。第一次輪詢成功前先顯示「台指期」。
  if (state.futuresEnabled) {
    const quote = state.futuresQuote;
    const text = quote ? esc(`${quote.symbol} ${quote.name || ""}`.trim()) : "台指期";
    tabs.push(`<span class="tab ${state.active === FUTURES_TAB ? "active" : ""}" `
      + `data-symbol="${FUTURES_TAB}">${text}</span>`);
  }

  state.symbols.forEach(s => {
    const snap = state.snapshots[s];
    // 訂閱未獲確認的代碼不能看起來跟正常追蹤中的代碼一樣——那正是實測踩過
    // 的坑：新增的股票靜靜留在分頁上，永遠不會有任何資料。
    const warn = snap && snap.subscribed === false
      ? `<span class="muted" style="color: var(--warn)" title="訂閱尚未獲得伺服器確認，暫時不會有資料">⚠</span>`
      : "";
    const removeBtn =
      `<button class="tab-remove" data-symbol="${esc(s)}" title="移除 ${esc(s)}">×</button>`;
    tabs.push(`<span class="tab ${s === state.active ? "active" : ""}" data-symbol="${esc(s)}">${
      warn}${label(snap)}${removeBtn}</span>`);
  });

  document.getElementById("tabs").innerHTML = tabs.join("");
  document.querySelectorAll(".tab").forEach(el =>
    el.addEventListener("click", event => {
      if (event.target.closest(".tab-remove")) return;   // 交給移除鈕自己的 handler
      // 使用者自己選過分頁之後，就不要再被「期貨是預設分頁」那段搶回去。
      state.tabChosen = true;
      state.active = el.dataset.symbol; renderTabs(); render();
    }));
  document.querySelectorAll(".tab-remove").forEach(btn =>
    btn.addEventListener("click", event => {
      event.stopPropagation();
      removeSymbol(btn.dataset.symbol);
    }));
}

// -- 新增／移除監控標的（Task 14）-------------------------------------------
// 失敗時把伺服器回傳的訊息顯示出來，不要靜默失敗——「訂閱數已達上限」
// 「查無此代碼」這類原因，使用者需要知道才知道下一步怎麼辦。
function showSymbolError(message) {
  const el = document.getElementById("symbolError");
  el.textContent = message;
  el.hidden = false;
}

function clearSymbolError() {
  document.getElementById("symbolError").hidden = true;
}

async function addSymbol() {
  const input = document.getElementById("newSymbol");
  const symbol = input.value.trim();
  if (!symbol) return;
  clearSymbolError();
  let response;
  try {
    response = await fetch("/api/symbols", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbol }),
    });
  } catch {
    showSymbolError("新增失敗：無法連線到伺服器");
    return;
  }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    showSymbolError(body.detail || `新增失敗（HTTP ${response.status}）`);
    return;
  }
  input.value = "";
  state.symbols = body.symbols;
  // 立刻要一份快照，不必空等下一次 ws 推播才看得到剛加的分頁內容
  // （新代碼還沒有任何成交時，快照本身就是合理的空狀態）。
  const snapResponse = await fetch(`/api/snapshot/${encodeURIComponent(symbol)}`);
  if (snapResponse.ok) state.snapshots[symbol] = await snapResponse.json();
  state.tabChosen = true;          // 剛加的股票要留得住，不能被預設分頁搶走
  state.active = symbol;
  renderTabs();
  render();
}

async function removeSymbol(symbol) {
  clearSymbolError();
  let response;
  try {
    response = await fetch(`/api/symbols/${encodeURIComponent(symbol)}`, { method: "DELETE" });
  } catch {
    showSymbolError("移除失敗：無法連線到伺服器");
    return;
  }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    showSymbolError(body.detail || `移除失敗（HTTP ${response.status}）`);
    return;
  }
  delete state.snapshots[symbol];
  state.symbols = body.symbols;
  // 切到第一檔；一檔股票都不剩時退到期貨分頁（若有），不要留在一個
  // 已經被刪掉的代碼上讓畫面整個空掉。
  if (state.active === symbol) {
    state.active = state.symbols[0] ?? (state.futuresEnabled ? FUTURES_TAB : null);
  }
  renderTabs();
  render();
}

document.getElementById("addSymbolBtn").onclick = addSymbol;
document.getElementById("newSymbol").onkeydown = event => {
  if (event.key === "Enter") addSymbol();
};

// -- 行情健康度 ------------------------------------------------------------
// 這是使用者判斷資料可不可信的唯一依據：實地發生過 Mac 睡眠、TCP 半開死亡，
// 畫面卻照樣顯示「已連線」，唯一症狀是時間戳凍住。這裡刻意不只靠 ws 推播
// 更新這個狀態——行情真的斷線時，恰好就是不會再有 trade 觸發推播的
// 時候，只依賴 ws 訊息會讓這個指標在最需要的時候跟著一起凍住。所以另外
// 用一個獨立的輪詢，直接問伺服器 GET /api/feed。
// Task 19：/api/feed 與 ws 的 "feed" 欄位是兩段式 {stock, futures}——股票與
// 期貨是各自獨立的連線，健康度不能合併成一個指標，不然使用者分不出是哪
// 一條斷了。這裡拆成兩個小函式各自更新畫面上對應的區塊。
function renderFeedStatus(combined) {
  if (!combined) return;
  state.feed = combined;
  renderStockStatus(combined.stock);
  renderFuturesStatus(combined.futures);
}

// 期貨行情健康度：獨立的一小行文字，不搶股票主狀態列的版面——期貨是次要
// 資訊，但斷掉時要看得出來，不能讓凍住的價格看起來像「盤面很安靜」。
function renderFuturesStatus(feed) {
  const el = document.getElementById("futStatus");
  if (!el || !feed) return;
  state.futuresStatus = feed;
  if (feed.state === "disabled") {
    el.textContent = "期貨：未啟用";
    el.title = "";
  } else if (feed.state === "connected") {
    const ago = feed.last_message_ago;
    el.textContent = `期貨：行情正常${ago != null ? `（${Math.round(ago)} 秒前）` : ""}`;
    el.title = feed.source || "";
  } else if (feed.state === "stale") {
    el.textContent = "期貨：行情停滯";
    el.title = feed.last_error || "已超過 90 秒沒有成功更新";
  } else if (feed.state === "unavailable") {
    el.textContent = "期貨：不可用";
    el.title = feed.unavailable_reason || "原因不明";
  } else {
    el.textContent = feed.reconnects > 0
      ? `期貨：重試中（第 ${feed.reconnects} 次）`
      : "期貨：取得行情中…";
    el.title = feed.last_error || "";
  }
}

// 期貨資料的輪詢。與 pollFeedStatus 分開是因為兩者的失敗語意不同：這支
// 拿不到資料時畫面上該顯示的是「期貨行情不可用」，而不是把整個看盤畫面
// 的健康度標成異常——股票那一條可能好得很。
async function pollFutures() {
  let body;
  try {
    const response = await fetch("/api/futures");
    if (!response.ok) return;
    body = await response.json();
  } catch {
    return;                     // 暫時的網路問題，維持上一次的畫面，下一輪再試
  }
  const hadTab = state.futuresEnabled;
  const previousSymbol = state.futuresQuote && state.futuresQuote.symbol;
  state.futuresEnabled = body.enabled;
  state.futuresStatus = body.status;
  if (body.quote) {
    state.futuresQuote = body.quote;
    // 1 分K 走同一份 chartData，K棒圖元件才不必知道資料是輪詢來的。
    state.chartData[body.quote.symbol] = body.quote;
  }
  // 分頁只在「出現／消失」或合約換月時重畫，不必每 5 秒重建一次 DOM。
  const nowSymbol = state.futuresQuote && state.futuresQuote.symbol;
  if (hadTab !== state.futuresEnabled || previousSymbol !== nowSymbol) renderTabs();

  // 期貨是預設分頁：第一次確認它可用時，若使用者還沒自己點過任何分頁，
  // 就切過去。之所以不是在 ws 的 init 直接寫死，是因為那時還不知道期貨
  // 有沒有啟用（--futures "" 可以關掉），而這兩件事誰先到並不固定。
  if (state.futuresEnabled && !state.tabChosen && state.active !== FUTURES_TAB) {
    state.active = FUTURES_TAB;
    renderTabs();
  }
  if (state.active === FUTURES_TAB) render();      // 拖曳中的攔截在 render() 裡
}

function renderStockStatus(feed) {
  if (!feed) return;
  const usage = document.getElementById("subUsage");
  if (usage && feed.subscription_limit != null) {
    usage.textContent = `訂閱 ${feed.subscription_count}/${feed.subscription_limit}`;
  }
  const el = document.getElementById("status");
  const ago = feed.last_message_ago;
  el.classList.remove("ok", "stale", "down");
  if (feed.state === "connected" && ago !== null && ago <= 60) {
    el.classList.add("ok");
    el.innerHTML = `<i class="dot"></i>行情正常（最後更新 ${Math.round(ago)} 秒前）`;
  } else if (feed.state === "connected") {
    el.classList.add("stale");
    const secs = ago !== null ? Math.round(ago) : "?";
    el.innerHTML = `<i class="dot"></i>行情停滯 ${secs} 秒`;
  } else if (feed.state === "reconnecting") {
    el.classList.add("down");
    el.innerHTML = feed.reconnects > 0
      ? `<i class="dot"></i>重新連線中（第 ${feed.reconnects} 次）`
      : `<i class="dot"></i>連線中…`;
  } else {
    el.classList.add("down");
    el.innerHTML = `<i class="dot"></i>行情已停止`;
  }
}

async function pollFeedStatus() {
  try {
    const response = await fetch("/api/feed");
    if (response.ok) renderFeedStatus(await response.json());
  } catch {
    // 網路暫時打嗝：維持上一次已知的狀態，下一輪輪詢再試。
  }
}
pollFeedStatus();
setInterval(pollFeedStatus, 5000);
// 與伺服器端的輪詢間隔一致（app/futures.py 的 DEFAULT_POLL_SECONDS）。再快
// 只會拿到同一份快照，因為那邊 5 秒才向期交所要一次。
pollFutures();
setInterval(pollFutures, 5000);

// 由頁面協定推導 ws/wss：寫死 ws:// 時，只要頁面經 HTTPS 提供（例如放在
// TLS 反向代理後），瀏覽器會以混合內容為由封鎖連線，整個畫面卡在「連線中…」。
const wsScheme = location.protocol === "https:" ? "wss:" : "ws:";
const ws = new WebSocket(`${wsScheme}//${location.host}/ws`);
ws.onclose = () => {
  const el = document.getElementById("status");
  el.classList.remove("ok", "stale");
  el.classList.add("down");
  el.innerHTML = `<i class="dot"></i>瀏覽器已斷線，請重整頁面`;
};
ws.onmessage = event => {
  const msg = JSON.parse(event.data);
  if (msg.type === "init") {
    state.snapshots = msg.snapshots;
    state.symbols = Object.keys(msg.snapshots);
    state.active = state.active ?? state.symbols[0];
    // 門檻不另存：每檔快照都帶自己的 large_order_lots，面板直接讀那個。
    renderTabs();
    renderFeedStatus(msg.feed);
  } else if (msg.type === "update") {
    state.snapshots[msg.snapshot.symbol] = msg.snapshot;
    renderFeedStatus(msg.feed);
    if (msg.snapshot.symbol !== state.active) return;
  }
  render();
};
</script>
